name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev pkg-config
      - name: Test
        run: cargo test --workspace --locked
      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked
      - name: Build release
        run: cargo build --release --locked -p linguaplay
      - uses: actions/upload-artifact@v4
        with:
          name: linguaplay-${{ runner.os }}
          path: |
            target/release/linguaplay
            target/release/linguaplay.exe
          if-no-files-found: error
