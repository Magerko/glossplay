name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev pkg-config
      - name: Remap build paths (Linux and macOS)
        if: runner.os != 'Windows'
        # Set for every later cargo step so tests and the release build share one set of flags.
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup --remap-path-prefix=${{ github.workspace }}=/src" >> "$GITHUB_ENV"
      - name: Test
        timeout-minutes: 45
        run: cargo test --workspace --locked
      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release (Linux and macOS)
        if: runner.os != 'Windows'
        run: cargo build --release --locked -p glossplay
      - name: Build release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/fetch-mpv.ps1 -Destination target\release
          ./scripts/package.ps1
      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: glossplay-windows-x64
          path: dist/glossplay-windows-x64.zip
          if-no-files-found: error
      - name: Upload binary
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: glossplay-${{ runner.os }}
          path: |
            target/release/glossplay
            target/release/glossplay.exe
          if-no-files-found: error
