[package]
name = "glossplay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A video player for language learners: dual subtitles, live transcription, word lookup"

[dependencies]
gp-core.workspace = true
gp-store.workspace = true
gp-ai.workspace = true
gp-media.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
directories = "6"
rfd = "0.15"
png = "0.18"
# Only deflate: the whisper.cpp release archives use nothing else.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
] }

# Host-only: it embeds the exe icon and version info, and does nothing for other hosts.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }
